services:
  ml:
    build: .
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./data_out:/app/data_out
    healthcheck:
      test: [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:${SERVER_PORT:-8080}/health')",
      ]
      interval: 20s
      timeout: 30s
      start_period: 180s
      retries: 3
